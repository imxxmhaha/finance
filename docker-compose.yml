version: "3.8"

services:
  # ============================================================
  # MySQL 数据库（中台服务依赖）
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./finance-data/sql/finance.sql:/docker-entrypoint-initdb.d/01-finance.sql
      - ./finance-data/sql/finance-customer.sql:/docker-entrypoint-initdb.d/02-finance-customer.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ============================================================
  # 中台服务 (finance-data)
  # ============================================================
  finance-data:
    build:
      context: ./finance-data
      dockerfile: Dockerfile
    container_name: finance-data
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: finance
      DATABASE_URL: "mysql+pymysql://root:root@mysql:3306/finance?charset=utf8mb4"
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================
  # 客服服务 (finance-customer-service-backend)
  # ============================================================
  customer-service:
    build:
      context: ./finance-customer-service-backend
      dockerfile: Dockerfile
    container_name: finance-customer-service
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "7000"
      LLM_MODEL: "qwen-plus-2025-07-28"
      LLM_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      LLM_API_KEY: "${LLM_API_KEY:-sk-5a0a81401f0740ca963115bfca78c0cf}"
      FINANCE_API_BASE_URL: "http://finance-data:8000"
      DATABASE_URL: "mysql+aiomysql://root:root@mysql:3306/finance-bot-service?charset=utf8mb4"
      API_CHANNEL_CODE: "OPEN_API"
      API_OPERATOR_NO: "EMP000006"
    depends_on:
      - finance-data

  # ============================================================
  # 前端 (finance-customer-service-frontend)
  # ============================================================
  frontend:
    build:
      context: ./finance-customer-service-frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - customer-service
      - finance-data

volumes:
  mysql_data:
