[project]
name = "finance-customer-service-backend"
version = "0.1.0"
description = "智能金融客服后端系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.3",
]

[project.scripts]
serve = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["atguigu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
