# HTTP 跳转 HTTPS
server {
    listen 80;
    server_name www.itzw.top itzw.top;
    return 301 https://$host$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl;
    server_name www.itzw.top itzw.top;

    ssl_certificate     /etc/letsencrypt/live/www.itzw.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.itzw.top/privkey.pem;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 代理客服服务
    location /api/ {
        proxy_pass http://customer-service:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 代理中台服务
    location /finance/ {
        proxy_pass http://finance-data:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://finance-data:8000/health;
    }
}
